spring.application.name=upi-offline-mesh
# Render (and most hosts) inject PORT.
server.port=${PORT:8085}

# Accounts and the bank ledger live in an in-memory H2 database (zero setup, wiped on restart).
spring.datasource.url=jdbc:h2:mem:upimesh;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Browse the ledger at http://localhost:8085/h2-console (JDBC URL above, user sa, empty password).
# Local demo only - never enable the console on a reachable server.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# How long a signed payment stays valid. Anything older is rejected as a replay,
# which also bounds how long the bank must remember idempotency keys.
upimesh.packet.max-age=PT24H

# Hop budget for gossip: each Bluetooth relay decrements it, at 0 the packet stops spreading.
upimesh.packet.initial-ttl=4
